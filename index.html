<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الفيديوهات القصيرة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        .app-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .video-card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .side-actions {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }

        .action-btn {
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .action-btn.liked { color: #ff2b54; }

        .video-info {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 80px;
            color: #fff;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .username { font-weight: bold; margin-bottom: 5px; font-size: 16px; cursor: pointer; color: #ff2b54; }
        .description { font-size: 14px; opacity: 0.9; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.9); border-top: 1px solid #222; display: flex;
            justify-content: space-around; align-items: center; z-index: 50;
        }
        .nav-item { background: none; border: none; color: #aaa; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #fff; }
        .nav-item span:first-child { font-size: 20px; }
    </style>
</head>
<body>

    <div class="app-container" id="videoContainer">
        
        <!-- الفيديو الأول -->
        <div class="video-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted playsinline onclick="togglePlay(this)"></video>
            <div class="side-actions">
                <button class="action-btn" onclick="toggleLike(this, 1200)">❤️ <span style="font-size:10px" class="count">1.2k</span></button>
                <button class="action-btn" onclick="location.href='profile.html'">👤</button>
                <a href="https://wa.me/" target="_blank" class="action-btn" title="واتساب">💬</a>
                <a href="https://instagram.com/" target="_blank" class="action-btn" title="انستغرام">📷</a>
                <a href="https://facebook.com/" target="_blank" class="action-btn" title="فيسبوك">📘</a>
            </div>
            <div class="video-info">
                <div class="username" onclick="location.href='profile.html'">@المستخدم_الأول</div>
                <div class="description">الفيديو الأول يعمل بسلاسة 🚀 (اسحب للأعلى للثاني)</div>
            </div>
        </div>

        <!-- الفيديو الثاني -->
        <div class="video-card">
            <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" loop muted playsinline onclick="togglePlay(this)"></video>
            <div class="side-actions">
                <button class="action-btn" onclick="toggleLike(this, 850)">❤️ <span style="font-size:10px" class="count">850</span></button>
                <button class="action-btn" onclick="location.href='profile.html'">👤</button>
                <a href="https://wa.me/" target="_blank" class="action-btn" title="واتساب">💬</a>
                <a href="https://instagram.com/" target="_blank" class="action-btn" title="انستغرام">📷</a>
                <a href="https://facebook.com/" target="_blank" class="action-btn" title="فيسبوك">📘</a>
            </div>
            <div class="video-info">
                <div class="username" onclick="location.href='profile.html'">@مصمم_الذكاء</div>
                <div class="description">الفيديو الثاني: طبيعة ساحرة 🌸</div>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="location.href='index.html'">
            <span>🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="location.href='profile.html'">
            <span>➕</span>
            <span>نشر</span>
        </button>
        <button class="nav-item" onclick="location.href='profile.html'">
            <span>👤</span>
            <span>الملف الشخصي</span>
        </button>
    </div>

    <script>
        function togglePlay(video) {
            if (video.paused) { video.play(); } else { video.pause(); }
        }

        function toggleLike(btn, count) {
            const countSpan = btn.querySelector('.count');
            if (btn.classList.contains('liked')) {
                btn.classList.remove('liked');
                countSpan.innerText = count;
            } else {
                btn.classList.add('liked');
                countSpan.innerText = count + 1;
            }
        }
    </script>
</body>
</html>
