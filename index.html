<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الملف الشخصي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding-bottom: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; }
        .back-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .profile-info { display: flex; flex-direction: column; align-items: center; margin-top: 20px; text-align: center; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #333; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 35px; border: 2px solid #ff2b54; }
        .username { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .verified { color: #20d5ec; font-size: 16px; }
        .bio { font-size: 13px; color: #aaa; margin: 8px 20px; }

        .stats { display: flex; justify-content: space-around; width: 80%; margin: 20px 0; }
        .stat-item { text-align: center; }
        .stat-value { font-weight: bold; font-size: 16px; }
        .stat-label { font-size: 12px; color: #aaa; }

        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-follow { background: #ff2b54; border: none; color: #fff; padding: 8px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .btn-social { background: #222; border: 1px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 12px; }

        .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #000; }
        .grid-item { aspect-ratio: 9/16; background: #222; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="location.href='index.html'">➔</button>
        <span>الملف الشخصي</span>
        <span>⚙️</span>
    </div>

    <div class="profile-info">
        <div class="avatar">👤</div>
        <div class="username">@المستخدم_الأول <span class="verified">✓</span></div>
        <div class="bio">صانع محتوى ذكاء اصطناعي وفيديوهات قصيرة 🚀</div>

        <div class="stats">
            <div class="stat-item"><div class="stat-value">120</div><div class="stat-label">متابعة</div></div>
            <div class="stat-item"><div class="stat-value">15.4k</div><div class="stat-label">متابعون</div></div>
            <div class="stat-item"><div class="stat-value">85.2k</div><div class="stat-label">تسجيلات إعجاب</div></div>
        </div>

        <div class="actions">
            <button class="btn-follow" id="followBtn" onclick="toggleFollow()">متابعة</button>
            <button class="btn-social">انستغرام 📷</button>
        </div>
    </div>

    <div class="video-grid">
        <div class="grid-item">فيديو 1</div>
        <div class="grid-item">فيديو 2</div>
        <div class="grid-item">فيديو 3</div>
    </div>

    <script>
        function toggleFollow() {
            const btn = document.getElementById('followBtn');
            if (btn.innerText === "متابعة") {
                btn.innerText = "تمت المتابعة";
                btn.style.background = "#333";
            } else {
                btn.innerText = "متابعة";
                btn.style.background = "#ff2b54";
            }
        }
    </script>

</body>
</html>
