<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الفيديوهات القصيرة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        .app-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        .video-card {
            width: 100%;
            height: 100vh;
            snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .side-actions {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }

        .action-btn {
            background: rgba(0,0,0,0.4);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }

        .video-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px;
            color: #fff;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .username { font-weight: bold; margin-bottom: 5px; font-size: 16px; }
        .description { font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="video-card">
            <video src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-leaves-26522-large.mp4" loop playsinline onclick="togglePlay(this)"></video>
            
            <div class="side-actions">
                <button class="action-btn" onclick="likeVideo(this)">❤️ <span style="font-size:10px">1.2k</span></button>
                <button class="action-btn">💬 <span style="font-size:10px">45</span></button>
                <button class="action-btn">🔗 <span style="font-size:10px">مشاركة</span></button>
            </div>

            <div class="video-info">
                <div class="username">@المستخدم_الأول</div>
                <div class="description">فيديو تجريبي أول لتطبيق الفيديوهات القصيرة! 🚀</div>
            </div>
        </div>

        <div class="video-card">
            <video src="https://assets.mixkit.co/videos/preview/mixkit-mother-with-her-little-daughter-eating-a-marshmallow-in-43748-large.mp4" loop playsinline onclick="togglePlay(this)"></video>
            
            <div class="side-actions">
                <button class="action-btn" onclick="likeVideo(this)">❤️ <span style="font-size:10px">850</span></button>
                <button class="action-btn">💬 <span style="font-size:10px">12</span></button>
                <button class="action-btn">🔗 <span style="font-size:10px">مشاركة</span></button>
            </div>

            <div class="video-info">
                <div class="username">@المستخدم_الثاني</div>
                <div class="description">تجربة السحب التنقلي بين الفيديوهات بنجاح 👏</div>
            </div>
        </div>

    </div>

    <script>
        function togglePlay(video) {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function likeVideo(btn) {
            btn.style.transform = "scale(1.2)";
            setTimeout(() => btn.style.transform = "scale(1)", 200);
        }

        const videos = document.querySelectorAll('video');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.play();
                } else {
                    entry.target.pause();
                }
            });
        }, { threshold: 0.6 });

        videos.forEach(video => observer.observe(video));
    </script>
</body>
</html>
