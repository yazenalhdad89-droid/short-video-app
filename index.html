<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الملف الشخصي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f0f; color: #fff; font-family: sans-serif; padding-bottom: 75px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; position: sticky; top: 0; background: #0f0f0f; z-index: 10; }
        .back-btn { background: #ff2b54; border: none; color: #fff; padding: 6px 15px; border-radius: 15px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .profile-info { display: flex; flex-direction: column; align-items: center; margin-top: 15px; text-align: center; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: #222; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 2.5px solid #ff2b54; }
        .username { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .verified { color: #20d5ec; font-size: 15px; }
        .bio { font-size: 13px; color: #bbb; margin: 8px 20px; line-height: 1.4; }

        .actions { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .btn-sec { background: #222; border: 1px solid #333; color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; text-decoration: none; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background: #0f0f0f; border-top: 1px solid #222; display: flex;
            justify-content: space-around; align-items: center; z-index: 50;
        }
        .nav-item { background: none; border: none; color: #777; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #fff; }
        .nav-item span:first-child { font-size: 22px; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="location.href='index.html'">العودة للرئيسية ➔</button>
        <span>الملف الشخصي</span>
        <span>⚙️</span>
    </div>

    <div class="profile-info">
        <div class="avatar">👤</div>
        <div class="username">@المستخدم_الأول <span class="verified">✓</span></div>
        <div class="bio">تطبيق الفيديوهات القصيرة 🚀</div>

        <div class="actions">
            <a href="https://wa.me/" target="_blank" class="btn-sec">💬 واتساب</a>
            <a href="https://t.me/" target="_blank" class="btn-sec">✈️ تيليجرام</a>
        </div>
    </div>

    <!-- شريط التنقل للرجوع السريع -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="location.href='index.html'">
            <span>🏠</span>
            <span>الرئيسية (رجوع)</span>
        </button>
    </div>

</body>
</html>
