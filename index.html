<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الفيديوهات - الرئيسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; color: #fff; font-family: sans-serif; overflow: hidden; }

        /* الهيدر العلوي وشريط البحث */
        .main-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; position: fixed; top: 0; width: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 100; gap: 10px; }
        .search-container { flex: 1; position: relative; }
        .search-input { width: 100%; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 20px; padding: 7px 15px 7px 35px; color: #fff; font-size: 13px; outline: none; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #ddd; }

        /* تغذية الفيديوهات بالسحب العمودي TikTok Style */
        .tiktok-feed { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .video-card { height: 100vh; width: 100vw; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; align-items: center; justify-content: center; }
        .video-card video { width: 100%; height: 100%; object-fit: cover; }

        /* أنيميشن القلب عند النقر المزدوج */
        .heart-pop { position: absolute; font-size: 80px; color: #ff2b54; pointer-events: none; animation: popHeart 0.8s ease-out forwards; z-index: 50; }
        @keyframes popHeart { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1) translateY(-40px); opacity: 0; } }

        /* الأزرار الجانبية */
        .side-actions { position: absolute; right: 12px; bottom: 90px; display: flex; flex-direction: column; align-items: center; gap: 18px; z-index: 20; }
        .action-icon { width: 48px; height: 48px; background: rgba(0,0,0,0.45); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
        .avatar-box { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ff2b54; background: #333; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; cursor: pointer; }
        .plus-btn { position: absolute; bottom: -5px; background: #ff2b54; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 13px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* معلومات الفيديو السفلية */
        .video-info { position: absolute; left: 15px; bottom: 85px; z-index: 20; max-width: 75%; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }

        /* نافذة التعليقات */
        .comments-modal { position: fixed; bottom: -100%; left: 0; width: 100%; height: 60vh; background: #181818; border-radius: 16px 16px 0 0; z-index: 300; transition: 0.3s ease; padding: 15px; display: flex; flex-direction: column; }
        .comments-modal.active { bottom: 0; }

        /* شريط التنقل السفلي */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: rgba(15,15,15,0.95); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 200; }
        .nav-item { background: none; border: none; color: #777; font-size: 11px; display: flex; flex-direction: column; align-items: center; cursor: pointer; text-decoration: none; }
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

    <div class="main-header">
        <a href="profile.html" class="nav-item" style="font-size:20px;">👤</a>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="بحث عن مستخدمين وفيديوهات...">
            <span class="search-icon">🔍</span>
        </div>
    </div>

    <div class="tiktok-feed">
        <!-- فيديو 1 -->
        <div class="video-card" onclick="handleVideoClick(event, this)">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay playsinline></video>
            <div class="side-actions">
                <div class="avatar-box" onclick="event.stopPropagation(); location.href='profile.html'">
                    👤 <div class="plus-btn" onclick="event.stopPropagation(); followCreator(this)">+</div>
                </div>
                <div class="action-icon" onclick="event.stopPropagation(); toggleLike(this)">❤️</div>
                <div class="action-icon" onclick="event.stopPropagation(); openComments()">💬</div>
                <div class="action-icon" onclick="event.stopPropagation(); alert('تم نسخ رابط الفيديو 🔗')">🔗</div>
            </div>
            <div class="video-info">
                <h3>@المستخدم_الأول ✓</h3>
                <p>فيديو مميز بتصوير عالي الجودة 🚀</p>
            </div>
        </div>

        <!-- فيديو 2 (سحب للأعلى والأسفل) -->
        <div class="video-card" onclick="handleVideoClick(event, this)">
            <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" loop playsinline></video>
            <div class="side-actions">
                <div class="avatar-box" onclick="event.stopPropagation(); location.href='profile.html'">
                    🌸 <div class="plus-btn" onclick="event.stopPropagation(); followCreator(this)">+</div>
                </div>
                <div class="action-icon" onclick="event.stopPropagation(); toggleLike(this)">❤️</div>
                <div class="action-icon" onclick="event.stopPropagation(); openComments()">💬</div>
                <div class="action-icon" onclick="event.stopPropagation(); alert('تم نسخ رابط الفيديو 🔗')">🔗</div>
            </div>
            <div class="video-info">
                <h3>@صانع_المحتوى 🌿</h3>
                <p>جمال الطبيعة والزهور 🌸</p>
            </div>
        </div>
    </div>

    <!-- نافذة التعليقات -->
    <div class="comments-modal" id="commentsModal">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <b>التعليقات</b>
            <button onclick="closeComments()" style="background:none; border:none; color:#fff; font-size:18px;">✕</button>
        </div>
        <div style="flex:1; overflow-y:auto;" id="commentsList">
            <p><b>@محمد:</b> فيديو رائع جداً! 🔥</p>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <input type="text" id="commentInp" style="flex:1; padding:8px; border-radius:15px; border:none;" placeholder="اكتب تعليقاً...">
            <button onclick="addComment()" style="background:#ff2b54; border:none; color:#fff; padding:8px 15px; border-radius:15px;">نشر</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><span>🏠</span><span>الرئيسية</span></a>
        <a href="profile.html" class="nav-item"><span>👤</span><span>الملف</span></a>
    </div>

    <script>
        let clickTimer = null;
        function handleVideoClick(event, card) {
            const video = card.querySelector('video');
            if (clickTimer == null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    if (video.paused) video.play(); else video.pause();
                }, 300);
            } else {
                clearTimeout(clickTimer); clickTimer = null;
                // نقر مزدوج = قلب إعجاب
                const heart = document.createElement('div');
                heart.className = 'heart-pop'; heart.innerText = '❤️';
                heart.style.left = (event.clientX - 40) + 'px';
                heart.style.top = (event.clientY - 40) + 'px';
                card.appendChild(heart);
                setTimeout(() => heart.remove(), 800);
            }
        }

        function followCreator(btn) {
            btn.innerText = (btn.innerText === "+") ? "✓" : "+";
            btn.style.background = (btn.innerText === "✓") ? "#20d5ec" : "#ff2b54";
        }

        function toggleLike(btn) {
            btn.style.color = (btn.style.color === 'red') ? '#fff' : 'red';
        }

        function openComments() { document.getElementById('commentsModal').classList.add('active'); }
        function closeComments() { document.getElementById('commentsModal').classList.remove('active'); }
        function addComment() {
            const inp = document.getElementById('commentInp');
            if(inp.value.trim()){
                document.getElementById('commentsList').innerHTML += `<p style="margin-top:5px;"><b>@أنت:</b> ${inp.value}</p>`;
                inp.value = '';
            }
        }
    </script>
</body>
</html>
